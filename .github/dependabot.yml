# .github/dependabot.yml
# Keeps pinned action SHAs and Python dependencies up to date with weekly PRs.
# The cooldown waits a few days before proposing a brand-new release, so a
# poisoned release (like Trivy v0.69.4, live for ~3 hours) is usually caught
# and pulled before we'd ever adopt it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
